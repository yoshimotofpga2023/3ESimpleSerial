<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Serial Distance Logger</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color-scheme: light;}
    body { background: #fff; color: #111; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .row { display:flex; flex-wrap: wrap; gap:8px; align-items:center; }
    .row .spacer { flex: 1 1 auto; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
    .muted { color:#666; }
    button { padding: 6px 10px; }
    select { padding: 4px; }
    #distList { margin: 8px 0 0; padding-left: 1.5rem; max-height: 450px; overflow: auto; }
    #log { width:100%; height:150px; resize:vertical; }
    .small { font-size: 12px; }

    /* ★ ChatGPT風のコピーラベル */
    .copy-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #ddd;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .copy-pill svg {
      width: 14px;
      height: 14px;
    }
    .copy-pill:hover {
      background-color: #f3f3f3;
    }
    .copy-pill.disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="row">
      <button id="btnConnect">Connect</button>
      <button id="btnDisconnect" disabled>Disconnect</button>
      <div class="spacer"></div>
      <label>Baud:
        <select id="baud">
          <option>9600</option>
          <option>19200</option>
          <option>38400</option>
          <option>57600</option>
          <option selected>115200</option>
        </select>
      </label>
      <label>Line end:
        <select id="lineEnd">
          <option value="lf">\n</option>
          <option value="crlf" selected>\r\n</option>
          <option value="none">None</option>
        </select>
      </label>
    </div>

    <div class="row" style="margin-top:8px;">
      <button id="btnStart" disabled>Start</button>
      <button id="btnStop" disabled>Stop</button>

      <!-- モード切替 -->
      <button id="btnModeStream" disabled>Stream</button>
      <button id="btnModeButton" disabled>Button</button>

      <div class="spacer"></div>
      <span id="status" class="muted">Status: Not connected.</span>
    </div>
  </div>

  <div class="panel" style="margin-top:12px;">
    <div class="row" style="align-items: baseline;">
      <h3 style="margin:0;">Distance (numeric lines only)</h3>
      <div class="spacer"></div>
      <span class="small muted">Startでリセットされる．</span>
    </div>
    <ol id="distList"></ol>
  </div>

  <details style="margin-top:12px;">
    <summary>受信ログ（左の▶をクリック．展開する）</summary>
    <textarea id="log" readonly></textarea>
  </details>

  <p class="small muted" style="margin-top:8px;">
    ※ Arduinoは、<strong>D</strong>（改行付き）を受信したとき、<strong>距離の数値だけ</strong>を1行で返すようにしてください（例: <code>123.4</code>）。
    <br/>
    ※ Buttonモードでは、Arduino側の物理ボタン押下で距離が送られてくる想定です（このページは数値行のみリストに追加）。
  </p>
</div>

<script>
(() => {
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const btnConnect = document.getElementById('btnConnect');
  const btnDisconnect = document.getElementById('btnDisconnect');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnModeStream = document.getElementById('btnModeStream');
  const btnModeButton = document.getElementById('btnModeButton');
  const baudSel = document.getElementById('baud');
  const lineEndSel = document.getElementById('lineEnd');
  const distList = document.getElementById('distList');

  let port = null;
  let reader = null;
  let keepReading = false;
  let rxBuffer = "";
  let timerId = null;
  let running = false;

  // ★追加：現在モード（Button中はStart禁止）
  let currentMode = "STREAM"; // "STREAM" or "BUTTON"

  function ln(s) {
    logEl.value += s + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(s) { statusEl.textContent = "Status: " + s; }

  function setUIConnected(yes) {
    btnConnect.disabled = yes;
    btnDisconnect.disabled = !yes;
    baudSel.disabled = yes;

    // ★Buttonモード中はStartを無効化（誤操作防止）
    btnStart.disabled = !yes || running || (currentMode === "BUTTON");
    btnStop.disabled  = !yes || !running;

    btnModeStream.disabled = !yes;
    btnModeButton.disabled = !yes;
  }

  function setUIRunning(yes) {
    running = yes;
    // ★Buttonモード中はStart不可
    btnStart.disabled = !port || yes || (currentMode === "BUTTON");
    btnStop.disabled  = !port || !yes;
  }

  function resetDistances() {
    distList.innerHTML = "";
  }
  function addDistanceLine(val) {
    const li = document.createElement('li');
    li.textContent = val;
    distList.appendChild(li);
  }
  function isNumericLine(line) {
    // 数値行ならtrue（整数/小数/符号/指数を許容）
    return /^[\s]*[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?[\s]*$/.test(line);
  }

  async function readLoop() {
    const decoder = new TextDecoder();
    try {
      while (port && keepReading) {
        const r = port.readable.getReader();
        reader = r;
        try {
          while (true) {
            const { value, done } = await r.read();
            if (done) break;
            if (value) {
              const chunk = decoder.decode(value);
              ln(chunk.replace(/\r/g, "\\r").replace(/\n/g, "\\n\n")); // ログ（可視化用）
              rxBuffer += chunk;

              // 行ごとに処理
              let idx;
              while ((idx = rxBuffer.search(/\r?\n/)) >= 0) {
                const line = rxBuffer.slice(0, idx);
                rxBuffer = rxBuffer.slice(
                  idx + (rxBuffer[idx] === '\r' && rxBuffer[idx+1] === '\n' ? 2 : 1)
                );
                const trimmed = line.trim();
                if (trimmed.length === 0) continue;
                if (isNumericLine(trimmed)) {
                  addDistanceLine(trimmed);
                }
              }
            }
          }
        } catch (e) {
          // 読み取り中断時など
        } finally {
          r.releaseLock();
          if (!keepReading) break;
        }
      }
    } catch (e) {
      ln("[read error] " + e);
    }
  }

  async function connect() {
    if (!("serial" in navigator)) {
      alert("このブラウザは Web Serial に対応していません。Chrome/Edge（デスクトップ）を使用してください。");
      return;
    }
    try {
      const baudRate = parseInt(baudSel.value, 10);
      port = await navigator.serial.requestPort();
      await port.open({ baudRate });

      // 接続直後はSTREAM扱いにしてUI整合を取る（任意）
      currentMode = "STREAM";

      setUIConnected(true);
      setStatus("Connected @ " + baudRate + " bps");
      ln("[connected]");
      keepReading = true;
      readLoop();
    } catch (e) {
      ln("[connect error] " + e);
      setStatus("Connect failed");
    }
  }

  async function disconnect() {
    try {
      stopMeasuring(); // 切断時には必ず停止
      keepReading = false;
      if (reader) {
        try { await reader.cancel(); } catch {}
        reader = null;
      }
      if (port) {
        try { await port.close(); } catch {}
      }
      port = null;
      setUIConnected(false);
      setStatus("Disconnected");
      ln("[disconnected]");
    } catch (e) {
      ln("[disconnect error] " + e);
    }
  }

  async function sendCommand(s) {
    if (!port) return;
    const enc = new TextEncoder();
    const le = lineEndSel.value;
    if (le === "lf") s += "\n";
    else if (le === "crlf") s += "\r\n";
    try {
      const w = port.writable.getWriter();
      await w.write(enc.encode(s));
      w.releaseLock();
    } catch (e) {
      ln("[write error] " + e);
    }
  }

  async function startMeasuring() {
    if (!port) return;

    // ★Buttonモード中はStartを無視（誤操作防止）
    if (currentMode === "BUTTON") {
      ln("[ui] Start ignored (BUTTON mode)");
      return;
    }

    // Streamモードへ（Arduino側が対応していれば）
    currentMode = "STREAM";
    await sendCommand("MODE STREAM");
    ln("[ui] mode=STREAM");

    // 表示をリセット
    resetDistances();

    // 二重開始防止
    if (timerId) clearInterval(timerId);

    // 1秒おきに「D」を送信（Arduinoは距離の数値のみ1行で返す想定）
    timerId = setInterval(() => sendCommand("D"), 1000);

    setUIRunning(true);
    setStatus("Measuring @ 1 Hz (STREAM)");
  }

  function stopMeasuring() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    setUIRunning(false);
    if (port) {
      // ★状態表示はモードに合わせる
      setStatus(currentMode === "BUTTON" ? "Connected (BUTTON)" : "Connected (stopped)");
    }
  }

  async function setModeStream() {
    if (!port) return;

    currentMode = "STREAM";
    await sendCommand("MODE STREAM");
    ln("[ui] mode=STREAM");

    // Streamに戻したのでStartの押下可否を更新
    setUIConnected(true);

    if (!running) setStatus("Connected (STREAM)");
  }

  async function setModeButton() {
    if (!port) return;

    // Buttonモードではポーリング停止（Arduinoの物理ボタンで送信）
    stopMeasuring();

    currentMode = "BUTTON";
    await sendCommand("MODE BUTTON");
    ln("[ui] mode=BUTTON (press physical button on Arduino)");

    // ★ButtonモードではStartを無効化して事故防止
    setUIConnected(true);

    setStatus("Connected (BUTTON)");
  }

  // UIイベント
  btnConnect.addEventListener('click', connect);
  btnDisconnect.addEventListener('click', disconnect);
  btnStart.addEventListener('click', startMeasuring);
  btnStop.addEventListener('click', stopMeasuring);
  btnModeStream.addEventListener('click', setModeStream);
  btnModeButton.addEventListener('click', setModeButton);

  // ポート抜去など
  navigator.serial?.addEventListener('disconnect', (event) => {
    if (port && event.target === port) {
      disconnect();
    }
  });
})();
</script>
</body>
</html>
